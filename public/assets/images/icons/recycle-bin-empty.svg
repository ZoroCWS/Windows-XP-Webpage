<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C92AE"/>
      <stop offset="30%" stop-color="#EBF1F8"/>
      <stop offset="70%" stop-color="#9FB2C8"/>
      <stop offset="100%" stop-color="#5B728D"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D9E4F0" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#7B9BB8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4B6A88" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#42B029"/>
      <stop offset="100%" stop-color="#1B6D0C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="1" stdDeviation="0.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <g filter="url(#shadow)">
    <!-- Bin Body -->
    <path d="M7 9 L9 28 C9 29.5 11 30.5 16 30.5 C21 30.5 23 29.5 23 28 L25 9 Z" fill="url(#bodyGrad)" stroke="#304868" stroke-width="1"/>
    
    <!-- Wire Mesh Grid Pattern lines -->
    <path d="M9 14 C12 15.5 20 15.5 23 14" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
    <path d="M10 20 C13 21.5 19 21.5 22 20" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
    <path d="M11 25 C13.5 26 18.5 26 21 25" fill="none" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1"/>
    
    <!-- Vertical wire lines -->
    <line x1="11" y1="9" x2="12" y2="28" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="0.8"/>
    <line x1="16" y1="9" x2="16" y2="30" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="0.8"/>
    <line x1="21" y1="9" x2="20" y2="28" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="0.8"/>

    <!-- Metallic Rim Top -->
    <ellipse cx="16" cy="9" rx="9" ry="3" fill="url(#rimGrad)" stroke="#324B66" stroke-width="1"/>
    <ellipse cx="16" cy="9" rx="7.5" ry="2" fill="#3D5A75" stroke="#1D2E45" stroke-width="0.5"/>

    <!-- Recycle Mobius Logo in center -->
    <g transform="translate(11, 14) scale(0.45)">
      <path d="M11 1 L15 6 L12 6 C12 10 15 12 18 12 L18 14 C13.5 14 10 11 10 6 L7 6 Z" fill="url(#arrowGrad)"/>
      <path d="M21 11 L16 15 L17.5 17.5 C14 20 10 18 8 15.5 L6.5 17 C9.5 20.5 15 22.5 19 19 L20.5 21.5 Z" fill="url(#arrowGrad)"/>
    </g>
  </g>
</svg>
