<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="ieBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6FB2F8"/>
      <stop offset="55%" stop-color="#2E6FE0"/>
      <stop offset="100%" stop-color="#1445A8"/>
    </linearGradient>
    <linearGradient id="ieGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE27A"/>
      <stop offset="55%" stop-color="#F0B429"/>
      <stop offset="100%" stop-color="#C77E00"/>
    </linearGradient>
    <linearGradient id="ieGoldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE27A"/>
      <stop offset="100%" stop-color="#D8940A"/>
    </linearGradient>
    <filter id="ieShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-opacity="0.35"/>
    </filter>
    <filter id="ieRingShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.5" dy="1" stdDeviation="0.8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#ieShadow)">
    <!-- Gold orbit band (behind the e) -->
    <ellipse cx="24" cy="26" rx="17.5" ry="11.5" transform="rotate(-8 24 26)"
             fill="none" stroke="url(#ieGold)" stroke-width="4.2" stroke-linecap="round" filter="url(#ieRingShadow)"/>

    <!-- Blue 'e' -->
    <path fill="url(#ieBlue)" stroke="#0D2F6B" stroke-width="1"
      d="M20.5 17.5
         C26.5 17.5 31 20.5 31.5 26
         C32 31.5 27.5 35 21.5 35
         C15.5 35 12 31 12 26.5
         C12 21 15.5 17.5 20.5 17.5 Z
         M22 21
         C19 21 16.8 22.8 16.8 25.8
         C16.8 28.8 19 30.6 22 30.6
         C25 30.6 27.2 28.8 27.2 25.8
         C27.2 22.8 25 21 22 21 Z"
      fill-rule="evenodd"/>

    <!-- Gloss highlight on the e -->
    <path d="M15.8 22.5 C16.2 19.8 18 17.9 20.6 17.6" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.55"/>

    <!-- Gold middle bar crossing the e -->
    <path d="M18.5 25.8 L33.2 25.8" fill="none" stroke="url(#ieGoldBar)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Gold sparkle -->
  <path fill="#FFE27A" stroke="#C77E00" stroke-width="0.5"
    d="M38.5 9 L39.5 12.2 L42.7 13.2 L39.5 14.2 L38.5 17.4 L37.5 14.2 L34.3 13.2 L37.5 12.2 Z"/>
</svg>
