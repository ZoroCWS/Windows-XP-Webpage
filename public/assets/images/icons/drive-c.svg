<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="driveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8E6DC"/>
      <stop offset="50%" stop-color="#C4C0B2"/>
      <stop offset="100%" stop-color="#A09C8E"/>
    </linearGradient>
  </defs>

  <!-- Drive Case -->
  <rect x="4" y="10" width="24" height="14" rx="2" fill="url(#driveGrad)" stroke="#605C50" stroke-width="1"/>
  <!-- Front Slot/Face -->
  <rect x="6" y="12" width="20" height="4" fill="#303028" rx="0.5"/>
  <!-- Windows Logo small icon -->
  <rect x="7" y="18" width="4" height="3" fill="#0080FF"/>
  <!-- Activity LED -->
  <circle cx="23" cy="19" r="1" fill="#30FF30"/>
</svg>
