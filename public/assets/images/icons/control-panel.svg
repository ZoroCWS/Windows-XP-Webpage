<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Background Plate Gradients -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1DFD6"/>
      <stop offset="60%" stop-color="#C0BEB4"/>
      <stop offset="100%" stop-color="#9C9A90"/>
    </linearGradient>
    <linearGradient id="blueGear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C8BF5"/>
      <stop offset="100%" stop-color="#1A54C0"/>
    </linearGradient>
    <linearGradient id="yellowGear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEE066"/>
      <stop offset="100%" stop-color="#D6A300"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#90C3F9"/>
      <stop offset="100%" stop-color="#4B90E2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="1" dy="1.5" stdDeviation="1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Main Computer/Plate Base with shadow -->
  <g filter="url(#shadow)">
    <!-- Plate -->
    <path d="M6 10 C6 8.5 7.5 7.5 9 7.5 L39 7.5 C40.5 7.5 42 8.5 42 10 L42 38 C42 39.5 40.5 40.5 39 40.5 L9 40.5 C7.5 40.5 6 39.5 6 38 Z" fill="url(#plateGrad)" stroke="#7A7870" stroke-width="1.5"/>
    <path d="M7.5 11 L40.5 11 L40.5 39 L7.5 39 Z" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Blue Gear (Back Layer) -->
  <g filter="url(#shadow)" transform="translate(18, 19)">
    <path d="M-2 -8 L2 -8 L3 -5 L6 -6 L8 -4 L5 -2 L8 0 L8 3 L5 3 L6 6 L4 8 L1 6 L-1 8 L-4 7 L-3 4 L-6 4 L-7 1 L-5 -1 L-7 -4 L-5 -6 L-2 -4 Z" fill="url(#blueGear)" stroke="#0E3880" stroke-width="1"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- Yellow/Orange Gear (Front Layer) -->
  <g filter="url(#shadow)" transform="translate(29, 27)">
    <path d="M-1.5 -6 L1.5 -6 L2 -4 L4 -4.5 L5.5 -3 L3.5 -1.5 L5.5 0 L5 2.5 L3 2 L3.5 4.5 L2 5.5 L0.5 4 L-1 5.5 L-3 4.5 L-2 2.5 L-4.5 2 L-5 -0.5 L-3 -1 L-4.5 -3 L-3 -4.5 L-1 -3 Z" fill="url(#yellowGear)" stroke="#9A7000" stroke-width="0.75"/>
    <circle cx="0" cy="0" r="1.8" fill="#FFFFFF"/>
  </g>

  <!-- Classic XP Sliders / Screws / Control Details -->
  <!-- Left Blue Screen Panel -->
  <rect x="10" y="14" width="12" height="10" rx="1" fill="url(#screenGrad)" stroke="#2B60B0" stroke-width="1" filter="url(#shadow)"/>
  <!-- Chart/Graph lines in screen -->
  <path d="M12 21 L15 17 L18 19 L20 16" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="20" cy="16" r="1" fill="#FF5252"/>

  <!-- Sliders / Knobs on right -->
  <g transform="translate(10, 28)">
    <!-- Slider 1 -->
    <line x1="0" y1="2" x2="16" y2="2" stroke="#605E56" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="4" y="0" width="3" height="4" rx="0.5" fill="#FEFEFE" stroke="#303030" stroke-width="0.75"/>
    
    <!-- Slider 2 -->
    <line x1="0" y1="6" x2="16" y2="6" stroke="#605E56" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="10" y="4" width="3" height="4" rx="0.5" fill="#FEFEFE" stroke="#303030" stroke-width="0.75"/>
  </g>
  
  <!-- Screws / LEDs -->
  <circle cx="10" cy="10" r="1" fill="#7A7870"/>
  <circle cx="38" cy="10" r="1" fill="#7A7870"/>
  <circle cx="38" cy="38" r="1" fill="#7A7870"/>
  <circle cx="10" cy="38" r="1" fill="#7A7870"/>
</svg>
