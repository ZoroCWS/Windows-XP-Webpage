<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066CC"/>
      <stop offset="100%" stop-color="#002266"/>
    </linearGradient>
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2F0E6"/>
      <stop offset="100%" stop-color="#C2C0B6"/>
    </linearGradient>
  </defs>

  <!-- Monitor Bezel -->
  <rect x="3" y="3" width="22" height="18" rx="2" fill="url(#bezelGrad)" stroke="#8A8880" stroke-width="1"/>
  <!-- Monitor Screen -->
  <rect x="5" y="5" width="18" height="13" rx="1" fill="url(#screenGrad)"/>
  <!-- Screen Bliss Hill curve -->
  <path d="M5 14 Q12 11 23 15 L23 18 L5 18 Z" fill="#50A020"/>
  <path d="M5 11 Q12 8 23 12 L23 15 Q12 11 5 14 Z" fill="#60C030"/>

  <!-- Monitor Stand -->
  <path d="M11 21 L17 21 L18 24 L10 24 Z" fill="#C2C0B6" stroke="#8A8880" stroke-width="0.8"/>
  <ellipse cx="14" cy="24" rx="6" ry="1.5" fill="#D8D6CC" stroke="#8A8880" stroke-width="0.8"/>

  <!-- PC Tower behind/side -->
  <rect x="22" y="8" width="8" height="18" rx="1" fill="url(#bezelGrad)" stroke="#7A7870" stroke-width="1"/>
  <line x1="24" y1="11" x2="28" y2="11" stroke="#8A8880" stroke-width="1"/>
  <line x1="24" y1="13" x2="28" y2="13" stroke="#8A8880" stroke-width="1"/>
  <circle cx="26" cy="22" r="1" fill="#40C040"/>
</svg>
